<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12151f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="סוליטר קלונדייק — משחק קלפים קלאסי בדפדפן, מותאם לטלפון, עם ביטול מהלכים, טיימר וניקוד.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="סוליטר">
  <title>סוליטר · מרכז המשחקים</title>
  <link rel="icon" href="icon.svg?v=12c2056b" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=16463c00">
  <link rel="manifest" href="manifest.webmanifest?v=03f8e3c0">
  <link rel="stylesheet" href="css/theme.css?v=1bf06a28">
  <link rel="stylesheet" href="css/solitaire.css?v=c14f80b8">
</head>
<body>

<div class="app">

  <header class="topbar">
    <a class="logo" href="index.html" title="חזרה למרכז המשחקים">
      <svg class="logo-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">סוליטר</span>
    </a>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="btnSettings" aria-label="הגדרות" title="הגדרות">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnStats" aria-label="סטטיסטיקות" title="סטטיסטיקות">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnTheme" aria-label="החלפת ערכת נושא" title="ערכת נושא">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="difficulty-row">
    <div class="pills" id="difficultyPills" role="group" aria-label="רמת קושי">
      <button type="button" class="pill is-active" data-difficulty="easy">קל</button>
      <button type="button" class="pill" data-difficulty="medium">בינוני</button>
      <button type="button" class="pill" data-difficulty="hard">קשה</button>
      <button type="button" class="pill" data-difficulty="expert">מומחה</button>
    </div>
    <button type="button" class="btn btn-primary btn-new" id="btnNew" aria-label="חלוקה חדשה" title="חלוקה חדשה">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></svg>
      <span class="btn-new-text">חלוקה חדשה</span>
    </button>
  </div>

  <div class="statusbar">
    <div class="stat">
      <span class="stat-label">זמן</span>
      <span class="stat-value" id="statTime">00:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">מהלכים</span>
      <span class="stat-value" id="statMoves">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">ניקוד</span>
      <span class="stat-value" id="statScore">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">נאספו</span>
      <span class="stat-value" id="statFound">0/52</span>
    </div>
    <button type="button" class="icon-btn stat-pause" id="btnPause" aria-label="השהיה" title="השהיה">
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
  </div>

  <main class="sol-board" id="board">
    <!-- שורה עליונה: חפיסה, נמשכים, ואז ארבע ערימות הסיום -->
    <div class="sol-row sol-top">
      <div class="pile stock" id="pileStock" data-zone="stock"></div>
      <div class="pile waste" id="pileWaste" data-zone="waste"></div>
      <div></div>
      <div class="pile foundation" data-zone="foundation" data-pile="0"></div>
      <div class="pile foundation" data-zone="foundation" data-pile="1"></div>
      <div class="pile foundation" data-zone="foundation" data-pile="2"></div>
      <div class="pile foundation" data-zone="foundation" data-pile="3"></div>
    </div>

    <!-- שבע עמודות המשחק -->
    <div class="sol-row sol-tableau" id="tableau"></div>
  </main>

  <div class="sol-actions" id="actions">
    <button type="button" class="tool" data-action="undo" aria-label="בטל מהלך">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-5-5 5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg>
      <span>בטל</span>
    </button>
    <button type="button" class="tool" data-action="redo" aria-label="בצע שוב">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg>
      <span>שוב</span>
    </button>
    <button type="button" class="tool" data-action="hint" aria-label="רמז">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.7h5.2c.1-.6.4-1.2 1-1.7A6 6 0 0 0 12 3z"/></svg>
      <span>רמז</span>
    </button>
    <button type="button" class="tool" data-action="collect" aria-label="אסוף לערימות הסיום">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>אסוף</span>
    </button>
    <button type="button" class="tool" data-action="new" aria-label="משחק חדש">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></svg>
      <span>חדש</span>
    </button>
  </div>

  <footer class="footer">
    <span id="footerInfo">משיכת קלף אחד</span>
  </footer>
</div>

<!-- ==================== ניצחון ==================== -->
<div class="modal" id="winModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="win-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="modal-title" id="winTitle">ניצחת!</h2>
    <p class="modal-sub" id="winSub">כל 52 הקלפים במקום</p>
    <div class="win-stats" id="winStats"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal>סגור</button>
      <button type="button" class="btn btn-primary" id="btnWinNew">משחק חדש</button>
    </div>
  </div>
</div>

<!-- ==================== מבוי סתום ==================== -->
<div class="modal" id="stuckModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stuckTitle">
    <div class="stuck-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>
    </div>
    <h2 class="modal-title" id="stuckTitle">נגמרו המהלכים</h2>
    <p class="modal-sub" id="stuckSub">אין יותר מהלך חוקי בחלוקה הזו.</p>
    <div class="win-stats" id="stuckStats"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnStuckUndo">בטל מהלך</button>
      <button type="button" class="btn btn-primary" id="btnStuckNew">חלוקה חדשה</button>
    </div>
  </div>
</div>

<!-- ==================== הגדרות ==================== -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 class="modal-title" id="settingsTitle">הגדרות</h2>
    <div class="settings-list">
      <label class="setting">
        <span class="setting-text">
          <span class="setting-name">הזזה בהקשה אחת</span>
          <span class="setting-desc">הקשה על קלף שולחת אותו לבד ליעד הטוב ביותר. לחיצה ארוכה = בחירת יעד ידנית</span>
        </span>
        <input type="checkbox" class="switch" id="optTapToMove" data-pref="tapToMove">
      </label>
      <label class="setting">
        <span class="setting-text">
          <span class="setting-name">איסוף אוטומטי</span>
          <span class="setting-desc">שולח קלפים לערימות הסיום ברגע שכולם גלויים</span>
        </span>
        <input type="checkbox" class="switch" id="optAutoCollect" data-pref="autoCollect">
      </label>
      <label class="setting">
        <span class="setting-text">
          <span class="setting-name">סימון יעדים</span>
          <span class="setting-desc">מדגיש לאן מותר להניח את הקלף שבחרת</span>
        </span>
        <input type="checkbox" class="switch" id="optShowTargets" data-pref="showTargets">
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" data-close-modal>סגור</button>
    </div>
  </div>
</div>

<!-- ==================== סטטיסטיקות ==================== -->
<div class="modal" id="statsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <h2 class="modal-title" id="statsTitle">סטטיסטיקות</h2>
    <div class="stats-table" id="statsTable"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnClearStats">איפוס נתונים</button>
      <button type="button" class="btn btn-primary" data-close-modal>סגור</button>
    </div>
  </div>
</div>

<!-- ==================== אישור ==================== -->
<div class="modal" id="confirmModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 class="modal-title" id="confirmTitle">אישור</h2>
    <p class="modal-sub" id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal>ביטול</button>
      <button type="button" class="btn btn-danger" id="btnConfirmOk">אישור</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/sw-register.js?v=89122463"></script>
<script src="js/solitaire/engine.js?v=a02fad77"></script>
<script src="js/solitaire/ui.js?v=3c5a69e1"></script>
</body>
</html>
